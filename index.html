<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Harbor — Cedar Hill School</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css?v=14" />
  </head>
  <body>
    <div class="app">
      <aside class="rail" aria-label="Primary">
        <a class="mark" href="#/" data-home>
          <span class="mark-glyph" aria-hidden="true"></span>
          Harbor
        </a>
        <nav class="rail-nav" id="rail-nav"></nav>
        <div class="child-switch" id="child-switch" hidden role="group" aria-label="Switch student"></div>
        <div class="rail-foot">
          <div class="avatar" id="avatar">JB</div>
          <div>
            <div class="rail-name" id="rail-name">Jordan Bowser</div>
            <div class="rail-role" id="rail-role">Parent · 3 children · K–8</div>
          </div>
        </div>
        <div class="role-switch" role="group" aria-label="View as">
          <button type="button" data-role="parent" class="is-on">Parent</button>
          <button type="button" data-role="teacher">Teacher</button>
          <button type="button" data-role="admin">Admin</button>
        </div>
      </aside>

      <main class="stage">
        <header class="topbar">
          <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
          <div class="topbar-end">
            <a class="bell" id="bell" href="#/alerts" aria-label="Notifications">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path
                  fill="currentColor"
                  d="M12 22a2.4 2.4 0 0 0 2.4-2.4H9.6A2.4 2.4 0 0 0 12 22Zm7-5.2V11a7 7 0 1 0-14 0v5.8L3 18.6V20h18v-1.4l-2-1.8Z"
                />
              </svg>
              <span class="nav-badge" id="bell-badge" hidden></span>
            </a>
            <div class="topbar-meta">
              <span class="dot live"></span>
              Week of Oct 13 · Cedar Hill K–8
            </div>
          </div>
        </header>
        <div id="view" class="view"></div>
      </main>
    </div>
    <div class="edition-toggle" role="group" aria-label="Product version">
      <span class="edition-kicker">Temp</span>
      <button type="button" data-edition="mvp">MVP</button>
      <button type="button" data-edition="dream">Dream</button>
    </div>
    <script src="./app.js?v=14" type="module"></script>
  </body>
</html>
